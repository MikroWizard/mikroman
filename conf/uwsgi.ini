
# uwsgi daemon config
# https://uwsgi-docs.readthedocs.io/en/latest/Options.html

# Docker dev mode — auto-reload enabled, more spoolers for dev iteration speed.
[uwsgi-docker-dev]
env = FLASK_ENV=development
env = PYSRV_CONFIG_PATH=/conf/server-conf.json
http = host.docker.internal:8181
master = 1
wsgi-file = py/main.py
callable = app
chdir = /app/
lazy-apps = true
single-interpreter = true
pythonpath = /app/py/
py-autoreload = 1
reload-mercy = 3

# --- Workers ---
# 4 workers for dev is sufficient. autoreload recycles all on file change.
processes = 4

# --- Thread support ---
enable-threads = true
threads = 1

# --- Request Timeout ---
harakiri = 90
harakiri-verbose = true

# --- Listen Queue ---
listen = 256

# --- Memory Protection ---
reload-on-rss = 256
max-requests = 2000

# --- Spooler ---
spooler-import = bgtasks
spooler-quiet = 1
spooler-ordered = 1
# 6 spoolers for dev — allows concurrent background tasks while iterating.
spooler-processes = 6
spooler-frequency = 5
spooler-harakiri = 1200
spooler = /tmp/my_spooler

# --- Timeouts ---
socket-timeout = 60

# --- Mules (independent worker processes) ---
mule = py/mules/radius.py
mule = py/mules/data_grabber.py
mule = py/mules/syslog.py
mule = py/mules/updater.py
mule = py/mules/firmware.py

# --- Static files ---
stats = 127.0.0.1:9100
static-map = /robots.txt=conf/robots.txt
static-map = /favicon.ico=conf/favicon.ico
disable-logging = 1



[uwsgi-production]
env = FLASK_ENV=production
env = PYSRV_CONFIG_PATH=/conf/server-conf.json
http = host.docker.internal:8181
master = 1
wsgi-file = py/main.py
callable = app
chdir = /app/
# lazy-apps: each worker loads the app independently.
# Required for Peewee connection pool thread-safety (per-process pools).
lazy-apps = true
single-interpreter = true
pythonpath = /app/py/

# --- Workers ---
# 4 workers: handles SSE live_stream, proxied requests, and API traffic.
# Enterprise (500+ devices, heavy dashboard/API usage): increase to 6-8.
# Each +1 worker = ~250MB RAM + 3 DB connections.
processes = 4

# --- Thread support ---
# enable-threads: required for ThreadPoolExecutor in bgtasks and task_run.
enable-threads = true
# threads per worker: 1 is enough for most deployments.
# Enterprise (many simultaneous dashboard users, SSE connections): increase to 2.
threads = 1

# --- Request Timeout ---
# Kill workers that take longer than 90 seconds on a single request.
# Note: device operations run in spoolers, not workers. Workers handle only API/HTTP.
# Enterprise with slow endpoints (large device lists, bulk operations): increase to 180.
harakiri = 90
harakiri-verbose = true

# --- Listen Queue ---
# Backlog for incoming connections when all workers are busy.
listen = 256

# --- Memory Protection ---
# Restart a worker if it exceeds 256MB RSS (memory leak protection).
# Workers are HTTP-only (no device threads). 256MB handles most API workloads.
# Enterprise: increase to 512 for large dataset responses (1000+ device lists).
reload-on-rss = 256
# Recycle each worker after 2000 requests (prevents slow memory growth).
# Enterprise (high traffic): increase to 5000 to reduce recycling overhead.
max-requests = 2000

# --- Spooler ---
spooler-import = bgtasks
spooler-quiet = 1
spooler-ordered = 1
# 4 spoolers handle 4 concurrent background tasks (backup, snippet, sequence, scan).
# Enterprise (500+ devices, many scheduled tasks overlapping): increase to 6.
# Caution: each spooler holds a DB pool of POOL_SIZE connections.
# Increasing spoolers → increase PostgreSQL max_connections accordingly.
spooler-processes = 4
spooler-frequency = 5
# Kill spool jobs that run longer than 1200s (20 min).
# Covers worst case: sequence with nested snippets on all devices.
# Enterprise (1000+ devices with long sequences): increase to 1800-2400.
spooler-harakiri = 1200
spooler = /tmp/my_spooler

# --- Mules (independent worker processes) ---
mule = py/mules/radius.py
mule = py/mules/data_grabber.py
mule = py/mules/syslog.py
mule = py/mules/updater.py
mule = py/mules/firmware.py

# --- Logging ---
vacuum = true
disable-logging = 1
logger = stdio
exec-asap = mkdir -p /conf/logs/
logto2 = /conf/logs/uwsgi-@(exec://date +%%Y-%%m-%%d).log
log-reopen = true
log-maxsize = 52428800
log-backupcount = 5
log-truncate = true

# --- Timeouts & Static Files ---
socket-timeout = 60
static-map = /robots.txt=conf/robots.txt
static-map = /favicon.ico=conf/favicon.ico

